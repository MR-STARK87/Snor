[package]
name = "snor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
notify = "8.2.0"
portable-pty = "0.9.0"
rfd = "0.17.2"
ropey = "1.6.1"
tree-sitter-highlight = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.8"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
vt100 = "0.16.2"

[profile.release]
strip = true
lto = "thin"
